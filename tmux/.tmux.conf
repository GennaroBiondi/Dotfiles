# Hey future me, in case you reinstalled your OS and are dumb enough, don't use TPM anymore, we just used it for a theme
# and it seems a bit much, so, from now on, you can just copy this config without the migraines that TPM causes.

# DONT. INSTALL. TPM.

# Set prefix
set -g prefix C-f

# Set `r` to reload
unbind r
bind r source-file ~/.tmux.conf

# Miscellaneous
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g set-clipboard on

unbind %
unbind '"'
unbind -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Make every new window follow the pwd of the last
bind c new-window -c "#{pane_current_path}"
set -g automatic-rename off

# Make window's index start at 1
set -g base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Set vim movement keys
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Set the status position to the top
set-option -g status-position top

clr_white="#FFFFFF"
clr_black="#000000"
clr_red="#FF0000"
clr_fg="$clr_red"
clr_hint="#ff6b6b"
clr_desel="#a30000"
clr_bg="#080808"

# Status bar
set -g status "on"
set -g status-bg "${clr_bg}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# Messages
set -g message-style "fg=${clr_fg},bg=${clr_bg},align=centre"
set -g message-command-style "fg=${clr_fg},bg=${clr_bg},align=centre"

# Panes
set -g pane-border-style "fg=${clr_desel}"
set -g pane-active-border-style "fg=${clr_hint}"

# Windows
set -g window-status-activity-style "fg=${clr_fg},bg=${clr_bg},none"
set -g window-status-separator " "
set -g window-status-style "fg=${clr_fg},bg=${clr_bg},none"

# Statusline - current window
set -g window-status-current-format "#[fg=${clr_hint},bg=${clr_bg}]|#I#[fg=${clr_fg},bg=${clr_bg}]#[fg=${clr_fg},bg=${clr_bg}]"

# Statusline - other windows
set -g window-status-format "#[fg=${clr_fg},bg=${clr_bg}] #I"

set -g status-left ""

# Statusline - right side
set -g status-right "#[fg=${clr_fg}]#{?client_prefix,#[fg=${clr_hint}],#[fg=${clr_fg}]}"

# Modes
set -g clock-mode-colour "${clr_fg}"
set -g mode-style "fg=${clr_fg} bg=${clr_bg} bold"
